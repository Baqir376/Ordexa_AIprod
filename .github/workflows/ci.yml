name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: ordexa, POSTGRES_PASSWORD: ordexa, POSTGRES_DB: ordexa}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ordexa" --health-interval 3s --health-retries 20
    defaults: {run: {working-directory: backend}}
    env:
      ORDEXA_DATABASE_URL: postgresql+psycopg://ordexa:ordexa@localhost:5432/ordexa
      ORDEXA_TEST_DATABASE_URL: postgresql+psycopg://ordexa:ordexa@localhost:5432/ordexa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - name: Migrations apply and match the models
        run: ordexa migrate && alembic check
      - run: pytest

  desktop:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: desktop/package-lock.json}
      - run: npm ci
        env: {ELECTRON_SKIP_BINARY_DOWNLOAD: "1"}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Phase 0 exit criterion: two PCs bill offline, reconnect, sync without duplicates.
  e2e-offline-sync:
    needs: [backend, desktop]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: ordexa, POSTGRES_PASSWORD: ordexa, POSTGRES_DB: ordexa}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ordexa" --health-interval 3s --health-retries 20
    env:
      ORDEXA_DATABASE_URL: postgresql+psycopg://ordexa:ordexa@localhost:5432/ordexa
      ORDEXA_E2E_URL: http://127.0.0.1:8000
      ORDEXA_E2E_TENANT: e2e-pharma
      ORDEXA_E2E_PASSWORD: e2e-pass-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm, cache-dependency-path: desktop/package-lock.json}
      - name: Start API with a seeded business
        working-directory: backend
        run: |
          pip install -e .
          ordexa migrate
          ordexa create-tenant --code e2e-pharma --name "E2E Pharma" --password "$ORDEXA_E2E_PASSWORD" --devices 5
          ordexa seed-demo --code e2e-pharma
          nohup uvicorn ordexa.apps.api:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - working-directory: desktop
        run: npm ci && npm run test:e2e
        env: {ELECTRON_SKIP_BINARY_DOWNLOAD: "1"}
      - if: failure()
        run: cat backend/api.log

  docker-image:
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ordexa-backend:${{ github.sha }} backend
